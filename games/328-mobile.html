<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="三角比建構者">
    <title>三角比極速挑戰（手機版）</title>
    <link rel="stylesheet" href="./mobile-shell.css">
    <style>
        :root {
            --primary: #3B82F6;
            --success: #10B981;
            --danger: #EF4444;
            --dark: #030712;
            --light: #F8FAFC;
            --accent: #FACC15;
            --glowing-cyan: #06B6D4;
        }

        html { font-size: 16px; }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%; height: 100dvh;
            overflow: hidden;
        }
        body {
            font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
            background-color: var(--dark);
            color: var(--light);
            touch-action: manipulation;
        }

        .hidden { display: none !important; }

        /* ---- Main Game Layout (Portrait-first) ---- */
        .game-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .geometry-pane {
            position: relative;
            flex: 1.55 1 0;
            min-height: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            border-bottom: 3px solid #334155;
            box-sizing: border-box;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #0f172a 0%, #030712 100%);
        }

        /* Compact single-row status bar inside geometry-pane (portrait) or info-pane (landscape) */
        .stats-bar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(15, 23, 42, 0.85);
            border-bottom: 1px solid #1e293b;
            box-sizing: border-box;
            z-index: 10;
        }
        .timer-box {
            font-size: clamp(1.15rem, 4.5vw, 1.5rem);
            color: var(--success);
            font-weight: 800;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            white-space: nowrap;
        }
        .timer-warning {
            color: var(--danger);
            text-shadow: 0 0 12px rgba(239, 68, 68, 0.75);
            animation: pulseTimer 0.5s infinite alternate;
        }
        @keyframes pulseTimer { from { transform: scale(1); } to { transform: scale(1.06); } }

        .stats-mid {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }
        .combo-box {
            font-size: 0.85rem;
            color: var(--glowing-cyan);
            font-weight: 800;
            font-style: italic;
            display: none;
            white-space: nowrap;
        }
        .combo-box.show { display: inline-block; }
        .penalty-box {
            font-size: 0.8rem;
            color: var(--danger);
            font-weight: 800;
            display: none;
            white-space: nowrap;
        }
        .penalty-box.show { display: inline-block; }

        .score-box {
            font-size: clamp(1rem, 4vw, 1.35rem);
            color: var(--accent);
            font-weight: 800;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            white-space: nowrap;
        }

        /* Question & instruction strip above canvas (unobstructed canvas!) */
        .q-floating-header {
            flex: 0 0 auto;
            width: 100%;
            padding: 6px 10px 4px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            z-index: 10;
            pointer-events: none;
        }
        .question-stem {
            font-size: clamp(0.95rem, 3.8vw, 1.2rem);
            font-weight: 700;
            background: rgba(15, 23, 42, 0.92);
            padding: 5px 14px;
            border-radius: 10px;
            border: 1.5px solid #475569;
            color: var(--light);
            text-align: center;
            line-height: 1.25;
            max-width: 100%;
        }
        .instruction-text {
            font-size: clamp(0.8rem, 3.2vw, 0.98rem);
            color: var(--accent);
            font-weight: 700;
            padding: 3px 10px;
            background: rgba(2, 6, 23, 0.85);
            border-radius: 8px;
            text-align: center;
            line-height: 1.25;
        }

        /* Native HTML math styling (zero external TeX CDN) */
        .math-tri, .math-ratio {
            font-family: "Times New Roman", Georgia, Cambria, serif;
            letter-spacing: 0.02em;
        }
        .math-tri i, .math-ratio i {
            font-style: italic;
            font-weight: 700;
        }
        .math-fn {
            font-style: normal;
            font-weight: 700;
            font-family: "Times New Roman", Georgia, Cambria, serif;
        }

        /* Canvas container */
        .viz-layer {
            flex: 1 1 0;
            min-height: 0;
            width: 100%;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }
        #main-canvas, #particle-canvas, #ripple-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
        }
        #main-canvas { z-index: 1; }
        #particle-canvas { z-index: 2; pointer-events: none; }
        #ripple-canvas { z-index: 3; pointer-events: none; }

        .level-up-banner {
            position: absolute;
            top: 52%; left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: clamp(1rem, 4.5vw, 1.45rem);
            font-weight: 800;
            color: var(--accent);
            text-shadow: 0 0 16px rgba(250, 204, 21, 0.5);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(2, 6, 23, 0.92);
            padding: 10px 18px;
            border-radius: 14px;
            border: 2px solid var(--accent);
            width: 82%;
            max-width: 380px;
            text-align: center;
            line-height: 1.35;
        }
        .level-up-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        /* Formula Pane */
        .info-pane {
            flex: 1 1 0;
            min-height: 0;
            width: 100%;
            background: radial-gradient(circle at top right, #1f2937 0%, #030712 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch;
            padding: 8px 12px;
            box-sizing: border-box;
            z-index: 10;
            overflow: hidden;
        }

        .formula-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1 1 0;
            min-height: 0;
            background: rgba(0, 0, 0, 0.28);
            border-radius: 16px;
            border: 3px solid var(--primary);
            padding: 8px 12px;
            box-shadow: 0 0 28px rgba(59, 130, 246, 0.2);
            transition: filter 0.25s;
            box-sizing: border-box;
        }
        .formula-zone.locked { filter: grayscale(100%) opacity(0.35); pointer-events: none; }
        .formula-title {
            font-size: clamp(0.9rem, 3.2vw, 1.15rem);
            color: #94A3B8;
            margin: 0 0 6px 0;
            letter-spacing: 2px;
            font-weight: 700;
        }
        .fraction-builder {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: "Times New Roman", Georgia, serif;
        }
        .func-label {
            font-size: clamp(1.6rem, 6.5vw, 2.5rem);
            font-weight: 700;
            color: var(--light);
            white-space: nowrap;
        }
        .eq-sign {
            font-size: clamp(1.5rem, 5.5vw, 2.2rem);
            color: var(--light);
            font-weight: 700;
        }
        .fraction-visual {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-width: 96px;
        }
        .slot {
            width: 100%;
            min-width: 88px;
            max-width: 150px;
            padding: 7px 10px;
            border: 3px dashed #475569;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(1.1rem, 4.5vw, 1.7rem);
            font-weight: 800;
            color: #64748B;
            transition: all 0.2s;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        @keyframes pulseActiveSlot {
            0%, 100% { border-color: var(--accent); box-shadow: 0 0 14px rgba(250, 204, 21, 0.3); transform: scale(1.02); background: rgba(250, 204, 21, 0.06); color: var(--accent); }
            50% { border-color: #FFF; box-shadow: 0 0 28px rgba(250, 204, 21, 0.75); transform: scale(1.06); background: rgba(250, 204, 21, 0.18); color: #FFF; }
        }
        .slot.active { animation: pulseActiveSlot 0.7s infinite; border-style: solid; z-index: 10; }
        .slot.filled { border-style: solid; border-color: var(--primary); color: var(--primary); background: rgba(59, 130, 246, 0.15); box-shadow: 0 0 18px rgba(59, 130, 246, 0.35); transform: scale(1); animation: none; z-index: 1; }
        .frac-line { width: 100%; height: 4px; background-color: var(--light); border-radius: 3px; }

        @keyframes bgShake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-10px, 6px); }
            40% { transform: translate(10px, -6px); }
            60% { transform: translate(-8px, -6px); }
            80% { transform: translate(8px, 6px); }
            100% { transform: translate(0, 0); }
        }
        .main-error { animation: bgShake 0.35s ease-in-out both; box-shadow: inset 0 0 120px rgba(239, 68, 68, 0.55) !important; }
        .main-success { box-shadow: inset 0 0 100px rgba(16, 185, 129, 0.35); transition: box-shadow 0.25s; }

        /* ---- Phone Landscape Layout ---- */
        @media (orientation: landscape) and (max-height: 500px) {
            .game-wrapper { flex-direction: row; }
            .geometry-pane {
                flex: 1.55 1 0;
                height: 100%;
                border-bottom: none;
                border-right: 3px solid #334155;
            }
            .info-pane {
                flex: 1 1 0;
                height: 100%;
                padding: 6px 10px;
                gap: 6px;
            }
            .stats-bar {
                border-bottom: none;
                border-radius: 10px;
                border: 1px solid #334155;
                padding: 5px 10px;
            }
            .q-floating-header { padding: 4px 8px 2px; gap: 2px; }
            .question-stem { font-size: 0.92rem; padding: 3px 10px; }
            .instruction-text { font-size: 0.8rem; padding: 2px 8px; }
            .formula-zone { padding: 6px 10px; }
            .formula-title { font-size: 0.85rem; margin-bottom: 4px; }
            .func-label { font-size: 1.6rem; }
            .slot { padding: 5px 8px; font-size: 1.15rem; min-width: 76px; }
        }

        /* ---- Scrollable Start & End Overlays (never clip h1 above HUD) ---- */
        .overlay {
            position: fixed;
            top: calc(var(--mgs-hud-h) + env(safe-area-inset-top));
            left: 0; right: 0; bottom: 0;
            z-index: 100;
            background: rgba(7, 11, 20, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 14px calc(14px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
            box-sizing: border-box;
        }
        .overlay-card {
            margin: auto 0;
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
        }
        .overlay h1 {
            margin: 0;
            font-size: clamp(1.65rem, 7vw, 2.5rem);
            line-height: 1.2;
        }
        .mgs-player-tag {
            color: var(--glowing-cyan);
            font-weight: 800;
            font-size: 1.05rem;
            background: rgba(6, 182, 212, 0.12);
            border: 1px solid rgba(6, 182, 212, 0.35);
            padding: 6px 16px;
            border-radius: 999px;
        }
        .rules-note {
            color: #CBD5E1;
            font-size: clamp(0.85rem, 3.2vw, 1rem);
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.45;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            margin-top: 4px;
        }
        .mega-btn {
            min-height: 50px;
            padding: 12px 22px;
            font-size: clamp(1.05rem, 4.2vw, 1.3rem);
            font-weight: 800;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.45);
            transition: transform 0.15s, background 0.15s;
            white-space: nowrap;
            outline: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .mega-btn:active { transform: scale(0.97); }
        .mega-btn.btn-success { background: var(--success); box-shadow: 0 8px 24px rgba(16, 185, 129, 0.38); }
        .mega-btn.btn-secondary { background: #475569; box-shadow: 0 8px 20px rgba(15, 23, 42, 0.5); }

        .leaderboard-box {
            background: rgba(15, 23, 42, 0.92);
            border: 3px solid var(--accent);
            border-radius: 16px;
            padding: 12px 14px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
        }
        .leaderboard-box h2 {
            color: var(--accent);
            font-size: clamp(1.15rem, 4.5vw, 1.5rem);
            margin: 0 0 8px 0;
        }
        .top10-badge {
            display: inline-block;
            background: rgba(250, 204, 21, 0.16);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 999px;
            padding: 4px 12px;
            font-weight: 800;
            font-size: 0.9rem;
        }
        .ritual-text {
            position: absolute;
            font-size: clamp(1.6rem, 6vw, 2.8rem);
            font-weight: 900;
            font-style: italic;
            opacity: 0;
            z-index: 50;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            pointer-events: none;
        }
        @keyframes flyUp {
            0% { opacity: 1; transform: translate(-50%, 20px) scale(0.6); }
            25% { opacity: 1; transform: translate(-50%, -10px) scale(1.1); }
            80% { opacity: 1; transform: translate(-50%, -65px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -95px) scale(0.85); }
        }
        @keyframes pulseRank {
            0%, 100% { background: rgba(250, 204, 21, 0.2); }
            50% { background: rgba(250, 204, 21, 0.4); }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .overlay { padding: 6px calc(16px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left)); }
            .overlay-card { max-width: 680px; gap: 6px; }
            .overlay h1 { font-size: 1.35rem; line-height: 1.15; }
            .mgs-player-tag { font-size: 0.88rem; padding: 3px 12px; }
            .rules-note { font-size: 0.82rem; padding: 6px 12px; line-height: 1.3; }
            .btn-row { gap: 8px; margin-top: 2px; }
            .mega-btn { min-height: 44px; padding: 8px 18px; font-size: 0.98rem; border-radius: 12px; }
            .leaderboard-box { padding: 6px 10px; }
            .leaderboard-box h2 { font-size: 1rem; margin: 0 0 4px 0; }
            .top10-badge { padding: 2px 10px; font-size: 0.8rem; }
            .mgs-top10 { font-size: 0.84rem; }
            .mgs-top10 td, .mgs-top10 th { padding: 2px 6px; }
        }
    </style>
</head>
<body>

<div id="start-screen" class="overlay">
    <div class="overlay-card">
        <h1 style="color: var(--glowing-cyan); text-shadow: 0 0 28px rgba(6, 182, 212, 0.5);">⚔️ 三角比建構者 ⚔️</h1>
        <div id="player-tag" class="mgs-player-tag hidden"></div>
        <div class="rules-note">
            第 1 關：點擊直角三角形對應邊，填入「分子」與「分母」。<br>
            進階關卡：先從發光頂點向下滑動至對邊畫出高線，再選擇對應邊！
        </div>
        <div class="btn-row">
            <button class="mega-btn" ontouchstart="forceUnlockAudio()" onmousedown="forceUnlockAudio()" onclick="startGame('30s')">⏱️ 30秒模式</button>
            <button class="mega-btn btn-success" ontouchstart="forceUnlockAudio()" onmousedown="forceUnlockAudio()" onclick="startGame('practice')">🧘 練習模式</button>
        </div>
        <div class="btn-row">
            <button class="mega-btn btn-secondary" onclick="window.MobileGameShell && window.MobileGameShell.goToLobby()">🏠 返回遊戲大廳</button>
        </div>
    </div>
</div>

<div class="game-wrapper hidden" id="main-wrapper">
    <div class="geometry-pane" id="geometry-pane">
        <div class="stats-bar" id="stats-card">
            <div class="timer-box" id="timer-display">30.0</div>
            <div class="stats-mid">
                <div class="combo-box" id="combo-display">x1 Combo!</div>
                <div class="penalty-box" id="penalty-display">連錯懲罰: -100</div>
            </div>
            <div class="score-box">分數: <span id="score-display">0</span></div>
        </div>
        <div class="q-floating-header">
            <div class="question-stem" id="question-text"></div>
            <div class="instruction-text" id="instruction"></div>
        </div>
        <div class="viz-layer" id="viz-layer">
            <canvas id="main-canvas"></canvas>
            <canvas id="particle-canvas"></canvas>
            <canvas id="ripple-canvas"></canvas>
        </div>
        <div class="level-up-banner" id="level-up-banner">🚀 難度升級：畫出高線！</div>
    </div>

    <div class="info-pane" id="right-pane">
        <div class="formula-zone" id="formula-zone">
            <h3 class="formula-title">建構目標</h3>
            <div class="fraction-builder">
                <div class="func-label" id="ratio-label">sin θ</div>
                <div class="eq-sign">=</div>
                <div class="fraction-visual">
                    <div class="slot" id="numerator-slot">分子</div>
                    <div class="frac-line"></div>
                    <div class="slot" id="denominator-slot">分母</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../core/config.js"></script>
<script src="../core/crypto.js"></script>
<script src="../core/registry.js"></script>
<script src="../core/storage.js"></script>
<script src="../core/netwatch.js"></script>
<script src="../core/api.js"></script>
<script src="../core/sync.js"></script>
<script src="../core/auth.js"></script>
<script src="../core/bonus.js?v=20261114d"></script>
<script src="./mobile-shell.js?v=20261114d"></script>
<script>
    const GAME_ID = 'trig-ratio';

    const SoundManager = {
        ctx: null, _sfxGain: null, _bgmGain: null, _bgmTimer: null, _bgmBeat: 0,
        _isMuted() {
            return !!(window.MobileGameShell && typeof window.MobileGameShell.isMuted === 'function' && window.MobileGameShell.isMuted());
        },
        init() {
            if (!this.ctx) {
                const AC = window.AudioContext || window.webkitAudioContext || window.mozAudioContext;
                try { if (AC) this.ctx = new AC(); } catch (e) { this.ctx = null; }
            }
            if (!this.ctx) return;
            if (this.ctx.state === 'suspended') this.ctx.resume().catch(function () {});
            if (!this._sfxGain) { this._sfxGain = this.ctx.createGain(); this._sfxGain.gain.value = 0.9; this._sfxGain.connect(this.ctx.destination); }
            if (!this._bgmGain) { this._bgmGain = this.ctx.createGain(); this._bgmGain.gain.value = 0.13; this._bgmGain.connect(this.ctx.destination); }
        },
        _panFromClientX(clientX) {
            if (clientX == null || typeof clientX !== 'number') return 0;
            return Math.max(-1, Math.min(1, (clientX / (window.innerWidth || 1)) * 2 - 1));
        },
        _connectToSFX(fromNode, pan) {
            if (!this.ctx || !this._sfxGain) return;
            const ac = this.ctx; const t = ac.currentTime;
            if (ac.createStereoPanner) {
                const panner = ac.createStereoPanner();
                panner.pan.setValueAtTime(pan, t);
                fromNode.connect(panner);
                panner.connect(this._sfxGain);
            } else {
                fromNode.connect(this._sfxGain);
            }
        },
        playLineHum(clientX) {
            if (this._isMuted()) return;
            this.init(); if (!this.ctx) return;
            const ac = this.ctx; const t = ac.currentTime; const pan = this._panFromClientX(clientX);
            const osc = ac.createOscillator(); const g = ac.createGain(); const f0 = 220 + Math.random() * 35;
            osc.type = 'sine'; osc.frequency.setValueAtTime(f0, t); osc.frequency.linearRampToValueAtTime(f0 + 45, t + 0.06);
            g.gain.setValueAtTime(0.045, t); g.gain.exponentialRampToValueAtTime(0.002, t + 0.07);
            osc.connect(g); this._connectToSFX(g, pan); osc.start(t); osc.stop(t + 0.08);
        },
        startBGM() {
            if (this._isMuted() || document.visibilityState === 'hidden') return;
            this.init(); if (!this.ctx || this._bgmTimer != null) return;
            const self = this; const ac = this.ctx;
            const chords = [[130.81, 164.81, 196.0], [116.54, 146.83, 174.61], [98.0, 123.47, 146.83], [110.0, 138.59, 164.81]];
            this._bgmBeat = 0;
            this._bgmTimer = setInterval(function () {
                if (gameState === 'GAMEOVER' || gameState === 'MENU' || self._isMuted() || document.visibilityState === 'hidden') {
                    self.stopBGM();
                    return;
                }

    function generateMission(level) {
        const triples = [
            [3,4,5], [4,3,5], [5,12,13], [12,5,13],
            [8,15,17], [15,8,17], [7,24,25], [24,7,25],
            [9,40,41], [20,21,29]
        ];
        const t = triples[Math.floor(Math.random() * triples.length)];
        const opp = t[0], adj = t[1], hyp = t[2];

        const funcs = [
            { name: 'sin', num: 'opp', den: 'hyp' },
            { name: 'cos', num: 'adj', den: 'hyp' },
            { name: 'tan', num: 'opp', den: 'adj' }
        ];
        const func = funcs[Math.floor(Math.random() * funcs.length)];

        const letters = ['A', 'B', 'C'];
        for (let i = letters.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [letters[i], letters[j]] = [letters[j], letters[i]];
        }
        const nameTop = letters[0], nameRef = letters[1], nameOther = letters[2];
        const dir = Math.random() > 0.5 ? 1 : -1;

        let angle = 0;
        if (level === 3) {
            const rotatedAngles = [45, 60, 120, 135, 210, 225, 300, 315];
            angle = rotatedAngles[Math.floor(Math.random() * rotatedAngles.length)] * Math.PI / 180;
        }

        const triName = `${nameTop}${nameRef}${nameOther}`;

        if (level === 1) {
            return {
                type: "easy",
                vis: { top: { pt: [0, opp], name: nameTop }, foot: { pt: [0, 0], name: nameOther }, ref: { pt: [adj * dir, 0], name: nameRef } },
                triName: triName, funcName: func.name, refName: nameRef,
                ratioText: `${func.name} ${nameRef}`, angle: angle, steps: { num: func.num, den: func.den },
                data: { opp: opp.toString(), adj: adj.toString(), hyp: hyp.toString() }
            };
        } else {
            let otherX;
            const absAdj = Math.abs(adj);
            const minGap = Math.max(2.2, opp * 0.55, absAdj * 0.28);
            const maxFromRef = absAdj - Math.max(2, absAdj * 0.25);
            if (Math.random() > 0.5 || maxFromRef <= minGap) {
                otherX = -dir * (minGap + Math.random() * Math.max(opp, absAdj * 0.5));
            } else {
                otherX = dir * (minGap + Math.random() * (maxFromRef - minGap));
            }
            return {
                type: "hard",
                vis: { top: { pt: [0, opp], name: nameTop }, foot: { pt: [0, 0], name: 'D' }, ref: { pt: [adj * dir, 0], name: nameRef }, other: { pt: [otherX, 0], name: nameOther } },
                triName: triName, funcName: func.name, refName: nameRef,
                ratioText: `${func.name} ${nameRef}`, angle: angle, steps: { num: func.num, den: func.den },
                data: { opp: opp.toString(), adj: adj.toString(), hyp: hyp.toString() }
            };
        }
    }

    function scheduleTimeout(fn, delay) {

    function roundRectPath(c, x, y, w, h, r) {
        const rad = Math.min(r, w / 2, h / 2);

        if (typeof c.roundRect === 'function') {
            c.roundRect(x, y, w, h, rad);
        } else {
            c.moveTo(x + rad, y);
            c.lineTo(x + w - rad, y);
            c.quadraticCurveTo(x + w, y, x + w, y + rad);
            c.lineTo(x + w, y + h - rad);
            c.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
            c.lineTo(x + rad, y + h);
            c.quadraticCurveTo(x, y + h, x, y + h - rad);
            c.lineTo(x, y + rad);
            c.quadraticCurveTo(x, y, x + rad, y);
            c.closePath();
        }
    }

    function syncStatsPlacement() {

        if (isLandscape) {

    function adaptCanvas() {
        const viz = document.getElementById('viz-layer');
        if (!viz || !canvas) return;
        const rect = viz.getBoundingClientRect();
        const cw = Math.round(rect.width || viz.clientWidth);
        const ch = Math.round(rect.height || viz.clientHeight);
        if (cw <= 0 || ch <= 0) return;
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        canvasCssW = cw;
        canvasCssH = ch;
        canvasDpr = dpr;
        const bw = Math.round(cw * dpr);
        const bh = Math.round(ch * dpr);
        [canvas, pCanvas, rCanvas].forEach(c => {
            if (!c) return;
            if (c.width !== bw || c.height !== bh) {
                c.width = bw;
                c.height = bh;
            }
        });
        if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (pCtx) pCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (rCtx) rCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    function startGame(mode = '30s') {
        if (window.MobileGameShell) {
            if (!shellOk || window.MobileGameShell.isLocked() || window.MobileGameShell.getPlaytimeStatus().locked) return;
            const stu = window.MobileGameShell.getStudent();
            if (stu && stu.name) currentPlayer = stu.name;

        document.querySelectorAll('.ritual-text').forEach(el => el.remove());

        particles.length = 0; ripples.length = 0; flashEdge = null; isDragging = false;

    function createExplosion(x, y) {
        for (let i = 0; i < 32; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 24,
                vy: (Math.random() - 0.5) * 24 - 7,
                radius: Math.random() * 5 + 2.5,
                color: Math.random() > 0.3 ? '#10B981' : (Math.random() > 0.5 ? '#FACC15' : '#38BDF8'),
                alpha: 1,
                decay: Math.random() * 0.025 + 0.02
            });
        }
    }
    function animateParticles() {
        if (pCtx && canvasCssW > 0 && canvasCssH > 0) {
            pCtx.clearRect(0, 0, canvasCssW, canvasCssH);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.65; p.alpha -= p.decay;
                if (p.alpha <= 0) { particles.splice(i, 1); continue; }
                pCtx.globalAlpha = p.alpha;
                pCtx.fillStyle = p.color;
                pCtx.beginPath();
                pCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                pCtx.fill();
            }
            pCtx.globalAlpha = 1;
        }
        requestAnimationFrame(animateParticles);
    }

            rCtx.clearRect(0, 0, canvasCssW, canvasCssH);

                r.radius += 5; r.alpha -= 0.035;

                rCtx.globalAlpha = r.alpha;
                rCtx.strokeStyle = "#06B6D4";
                rCtx.lineWidth = 2.5;
                rCtx.beginPath();
                rCtx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                rCtx.stroke();
            }
            rCtx.globalAlpha = 1;
        }
        requestAnimationFrame(animateRipples);
    }

    function getCanvasCoords(clientX, clientY) {
        if (clientX === undefined || clientY === undefined || !canvas) return { x: 0, y: 0 };
        const rect = canvas.getBoundingClientRect();
        return { x: clientX - rect.left, y: clientY - rect.top };
    }
    function dist2(v, w) { return Math.pow(v.x - w.x, 2) + Math.pow(v.y - w.y, 2); }
    function distToSegment(p, v, w) {
        const l2 = dist2(v, w);
        if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
        let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    function onPointerDown(e) {
        if (gameState !== "DRAWING_PHASE" && gameState !== "SELECTION_PHASE") return;
        lastPointerClientX = e.clientX;
        const pos = getCanvasCoords(e.clientX, e.clientY);
        pointerDownTime = Date.now();
        pointerDownPos = pos;
        createRipple(pos.x, pos.y);
        if (gameState === "DRAWING_PHASE" && ctx.renderData) {
            const topVertex = ctx.renderData.pA;
            if (Math.hypot(pos.x - topVertex.x, pos.y - topVertex.y) < Math.max(48, canvasCssW * 0.14)) {
                isDragging = true;
                drawStartX = topVertex.x; drawStartY = topVertex.y;
                mouseX = pos.x; mouseY = pos.y;
                try { SoundManager.play('lineGrab', e.clientX); } catch (err) {}
                try { document.getElementById('viz-layer').setPointerCapture(e.pointerId); } catch (err) {}
            }
        }
    }

    function onPointerMove(e) {
        if (!isDragging) return;
        const pos = getCanvasCoords(e.clientX, e.clientY);
        mouseX = pos.x; mouseY = pos.y;
        const now = performance.now();
        if (now - lastAuxLineSoundAt > 52) {
            lastAuxLineSoundAt = now;
            try { SoundManager.playLineHum(e.clientX); } catch (err) {}
        }
        drawGeometry();
        ctx.strokeStyle = "#FACC15";
        ctx.lineWidth = Math.max(4, canvasCssW * 0.012);
        ctx.setLineDash([12, 10]);
        ctx.beginPath();
        ctx.moveTo(drawStartX, drawStartY);
        ctx.lineTo(mouseX, mouseY);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    function onPointerUp(e) {
        const pos = getCanvasCoords(e.clientX, e.clientY);
        if (isDragging) {
            isDragging = false;
            try { document.getElementById('viz-layer').releasePointerCapture(e.pointerId); } catch (err) {}
            if (!ctx.renderData) return;
            const targetFoot = ctx.renderData.pD;
            const expectedDist = Math.hypot(targetFoot.x - drawStartX, targetFoot.y - drawStartY);
            const dragDist = Math.hypot(mouseX - drawStartX, mouseY - drawStartY);
            const expectedAngle = Math.atan2(targetFoot.y - drawStartY, targetFoot.x - drawStartX);
            const dragAngle = Math.atan2(mouseY - drawStartY, mouseX - drawStartX);

            let angleDiff = Math.abs(expectedAngle - dragAngle);
            if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;

            if (dragDist > Math.max(32, expectedDist * 0.4) && angleDiff < 0.6) {
                createExplosion(targetFoot.x, targetFoot.y);
                showFloatingText("NICE LINE!", "#FACC15");
                try { SoundManager.play('lineComplete', e.clientX); } catch (err) {}
                gameState = "SELECTION_PHASE";
                document.getElementById("formula-zone").classList.remove("locked");
                updateInstruction();
            } else {
                handlePenalty();
            }
            drawGeometry();
            return;
        }
        if (gameState === "SELECTION_PHASE") {
            const viz = document.getElementById('viz-layer');
            if (viz && !viz.contains(e.target)) return;
            if (pos.x < 0 || pos.x > canvasCssW || pos.y < 0 || pos.y > canvasCssH) return;
            const distMoved = Math.hypot(pos.x - pointerDownPos.x, pos.y - pointerDownPos.y);
            if (distMoved < 30 && Date.now() - pointerDownTime < 500) {
                handleCanvasClick(pos);
            }
        }
    }

    function handleCanvasClick(pos) {
        if (!ctx.renderData) return;
        const { pA, pD, pRef } = ctx.renderData;
        const edges = [
            { id: "opp", p1: pA, p2: pD },
            { id: "adj", p1: pD, p2: pRef },
            { id: "hyp", p1: pA, p2: pRef }
        ];
        let bestEdge = null;
        let minScore = Infinity;
        const hitTol = Math.max(36, Math.min(canvasCssW, canvasCssH) * 0.14);
        edges.forEach(edge => {
            const dLine = distToSegment(pos, edge.p1, edge.p2);
            const mid = { x: (edge.p1.x + edge.p2.x) / 2, y: (edge.p1.y + edge.p2.y) / 2 };
            const edgeScore = dLine + Math.hypot(pos.x - mid.x, pos.y - mid.y) * 0.15;
            if (dLine < hitTol && edgeScore < minScore) {
                minScore = edgeScore;
                bestEdge = edge;
            }
        });
        if (bestEdge) handleEdgeSelection(bestEdge.id);
    }

    function drawGeometry() {
        if (!ctx || canvasCssW <= 0 || canvasCssH <= 0 || !currentMission) return;
        ctx.clearRect(0, 0, canvasCssW, canvasCssH);
        const data = currentMission.vis;

        const padX = Math.max(26, canvasCssW * 0.09);
        const padY = Math.max(24, canvasCssH * 0.11);
        const drawW = Math.max(20, canvasCssW - padX * 2);
        const drawH = Math.max(20, canvasCssH - padY * 2);

        const rawPts = [data.top.pt, data.foot.pt, data.ref.pt];
        if (data.other) rawPts.push(data.other.pt);

        const angle = currentMission.angle || 0;
        const rotatePt = (pt, ang) => [
            pt[0] * Math.cos(ang) - pt[1] * Math.sin(ang),
            pt[0] * Math.sin(ang) + pt[1] * Math.cos(ang)
        ];

        const rotPts = rawPts.map(pt => rotatePt(pt, angle));
        const minX = Math.min(...rotPts.map(p => p[0]));
        const maxX = Math.max(...rotPts.map(p => p[0]));
        const minY = Math.min(...rotPts.map(p => p[1]));
        const maxY = Math.max(...rotPts.map(p => p[1]));

        const spanX = Math.max(1e-3, maxX - minX);
        const spanY = Math.max(1e-3, maxY - minY);
        const scale = Math.min(drawW / spanX, drawH / spanY) * 0.82;

        const cx = canvasCssW / 2;
        const cy = canvasCssH / 2;

        const toScreen = (rawPt) => {
            const rot = rotatePt(rawPt, angle);
            return {
                x: cx + (rot[0] - (minX + maxX) / 2) * scale,
                y: cy - (rot[1] - (minY + maxY) / 2) * scale
            };
        };

        const pA = toScreen(data.top.pt);
        const pD = toScreen(data.foot.pt);
        const pRef = toScreen(data.ref.pt);
        const pOther = data.other ? toScreen(data.other.pt) : null;
        ctx.renderData = { pA, pD, pRef, scale };

        ctx.fillStyle = "rgba(59, 130, 246, 0.05)";
        ctx.beginPath();
        ctx.moveTo(pA.x, pA.y);
        ctx.lineTo(pRef.x, pRef.y);
        if (pOther) ctx.lineTo(pOther.x, pOther.y); else ctx.lineTo(pD.x, pD.y);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "rgba(148, 163, 184, 0.92)";
        ctx.lineWidth = Math.max(3, Math.min(5, canvasCssW * 0.01));
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(pA.x, pA.y);
        ctx.lineTo(pRef.x, pRef.y);
        if (pOther) ctx.lineTo(pOther.x, pOther.y); else ctx.lineTo(pD.x, pD.y);
        ctx.closePath();
        ctx.stroke();

        const rightAngleSize = Math.max(10, Math.min(18, scale * 0.16));
        if (currentMission.type === "hard") {
            if (data.ref.pt[0] * data.other.pt[0] > 0) {
                ctx.strokeStyle = "rgba(148, 163, 184, 0.5)";
                ctx.lineWidth = Math.max(2, canvasCssW * 0.005);
                ctx.setLineDash([7, 7]);
                ctx.beginPath();
                ctx.moveTo(pD.x, pD.y);
                const innerPoint = Math.abs(data.ref.pt[0]) < Math.abs(data.other.pt[0]) ? pRef : pOther;
                ctx.lineTo(innerPoint.x, innerPoint.y);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            if (gameState === "DRAWING_PHASE") {
                ctx.beginPath();
                ctx.arc(pA.x, pA.y, rightAngleSize * 1.45, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(250, 204, 21, 0.3)";
                ctx.fill();
                ctx.lineWidth = Math.max(2, canvasCssW * 0.006);
                ctx.strokeStyle = "#FACC15";
                ctx.stroke();
            } else if (gameState === "SELECTION_PHASE" || gameState === "SUCCESS") {
                ctx.strokeStyle = "#10B981";
                ctx.lineWidth = Math.max(3, canvasCssW * 0.008);
                ctx.setLineDash([9, 8]);
                ctx.beginPath();
                ctx.moveTo(pA.x, pA.y);
                ctx.lineTo(pD.x, pD.y);
                ctx.stroke();
                ctx.setLineDash([]);
                drawRightAngle(ctx, pD, pRef, pA, rightAngleSize);
            }
        } else if (currentMission.type === "easy" && (gameState === "SELECTION_PHASE" || gameState === "SUCCESS")) {
            drawRightAngle(ctx, pD, pRef, pA, rightAngleSize);
        }

        if (gameState === "SELECTION_PHASE" || gameState === "SUCCESS") {
            const refColorRgb = varToRgb("--accent");
            ctx.strokeStyle = `rgba(${refColorRgb}, 1)`;
            ctx.fillStyle = `rgba(${refColorRgb}, 0.2)`;
            ctx.lineWidth = Math.max(2.5, canvasCssW * 0.006);
            const d1 = Math.hypot(pA.x - pRef.x, pA.y - pRef.y);
            const d2 = Math.hypot(pD.x - pRef.x, pD.y - pRef.y);
            const arcR = Math.max(12, Math.min(32, Math.min(d1, d2) * 0.35));
            const angA = Math.atan2(pA.y - pRef.y, pA.x - pRef.x);
            const angD = Math.atan2(pD.y - pRef.y, pD.x - pRef.x);
            const delta = Math.atan2(Math.sin(angA - angD), Math.cos(angA - angD));
            ctx.beginPath();
            ctx.moveTo(pRef.x, pRef.y);
            ctx.arc(pRef.x, pRef.y, arcR, angD, angD + delta, delta < 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        const labelOffset = Math.max(16, Math.min(26, scale * 0.22));
        drawVertexLabelSmart(ctx, pA, data.top.name, cx, cy, labelOffset, "148, 163, 184");
        drawVertexLabelSmart(ctx, pRef, data.ref.name, cx, cy, labelOffset, "148, 163, 184");
        if (pOther) drawVertexLabelSmart(ctx, pOther, data.other.name, cx, cy, labelOffset, "148, 163, 184");
        if (currentMission.type === "easy") {
            drawVertexLabelSmart(ctx, pD, data.foot.name, cx, cy, labelOffset, "148, 163, 184");
        }

        if (gameState === "SELECTION_PHASE" || gameState === "SUCCESS") {
            if (currentMission.type === "hard") {
                drawVertexLabelSmart(ctx, pD, "D", cx, cy, labelOffset * 0.85, varToRgb("--success"));
            }
            const triCentroid = { x: (pA.x + pD.x + pRef.x) / 3, y: (pA.y + pD.y + pRef.y) / 3 };
            drawEdgeLabelsDeoverlapped(ctx, [
                { p1: pA, p2: pD, text: currentMission.data.opp },
                { p1: pD, p2: pRef, text: currentMission.data.adj },
                { p1: pA, p2: pRef, text: currentMission.data.hyp }
            ], triCentroid);
        }

        if (flashEdge) {
            let p1, p2;
            if (flashEdge.id === "opp") { p1 = pA; p2 = pD; }
            else if (flashEdge.id === "adj") { p1 = pD; p2 = pRef; }
            else { p1 = pA; p2 = pRef; }
            ctx.strokeStyle = flashEdge.color;
            ctx.lineWidth = Math.max(5, canvasCssW * 0.014);
            ctx.shadowColor = flashEdge.color;
            ctx.shadowBlur = Math.max(12, canvasCssW * 0.03);
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
            ctx.shadowBlur = 0;
            if (Date.now() > flashEdge.timer) {
                flashEdge = null;
                flashRafId = null;
                drawGeometry();
            } else {
                if (flashRafId != null) cancelAnimationFrame(flashRafId);
                flashRafId = requestAnimationFrame(drawGeometry);
            }
        }
    }

    function drawRightAngle(c, vertex, p1, p2, size) {
        let v1x = p1.x - vertex.x, v1y = p1.y - vertex.y;
        const len1 = Math.hypot(v1x, v1y) || 1;
        v1x = (v1x / len1) * size; v1y = (v1y / len1) * size;
        let v2x = p2.x - vertex.x, v2y = p2.y - vertex.y;
        const len2 = Math.hypot(v2x, v2y) || 1;
        v2x = (v2x / len2) * size; v2y = (v2y / len2) * size;
        c.strokeStyle = "rgba(148, 163, 184, 0.75)";
        c.lineWidth = Math.max(2, canvasCssW * 0.005);
        c.beginPath();
        c.moveTo(vertex.x + v1x, vertex.y + v1y);
        c.lineTo(vertex.x + v1x + v2x, vertex.y + v1y + v2y);
        c.lineTo(vertex.x + v2x, vertex.y + v2y);
        c.stroke();
    }

    function drawVertexLabelSmart(c, p, text, cx, cy, offsetDist, colorRgb) {
        const dx = p.x - cx, dy = p.y - cy;
        const len = Math.hypot(dx, dy) || 1;
        const offX = (dx / len) * offsetDist, offY = (dy / len) * offsetDist;
        const fSize = Math.max(13, Math.min(18, canvasCssW * 0.04));
        const tx = Math.max(14, Math.min(canvasCssW - 14, p.x + offX));
        const ty = Math.max(14, Math.min(canvasCssH - 14, p.y + offY));
        c.fillStyle = `rgba(${colorRgb}, 1)`;
        c.font = `bold ${fSize}px system-ui, sans-serif`;
        c.textAlign = "center";
        c.textBaseline = "middle";
        c.fillText(text, tx, ty);
    }

    function drawEdgeLabelsDeoverlapped(c, items, centroid) {
        const fSize = Math.max(12, Math.min(16, canvasCssW * 0.036));
        c.font = `bold ${fSize}px system-ui, sans-serif`;
        const pills = items.map(it => {
            const mx = (it.p1.x + it.p2.x) / 2;
            const my = (it.p1.y + it.p2.y) / 2;
            const edx = it.p2.x - it.p1.x, edy = it.p2.y - it.p1.y;
            const elen = Math.hypot(edx, edy) || 1;
            let nx = -edy / elen, ny = edx / elen;
            if ((mx - centroid.x) * nx + (my - centroid.y) * ny < 0) { nx = -nx; ny = -ny; }
            const w = c.measureText(it.text).width;
            const padX = fSize * 0.34, padY = fSize * 0.28;
            const bw = w + padX * 2, bh = fSize + padY * 2;
            return {
                text: it.text,
                cx: mx + nx * 4,
                cy: my + ny * 4,
                nx: nx, ny: ny,
                bw: bw, bh: bh
            };
        });

        for (let pass = 0; pass < 6; pass++) {
            for (let i = 0; i < pills.length; i++) {
                for (let j = i + 1; j < pills.length; j++) {
                    const a = pills[i], b = pills[j];
                    const minDx = (a.bw + b.bw) / 2 + 5;
                    const minDy = (a.bh + b.bh) / 2 + 5;
                    const dx = a.cx - b.cx, dy = a.cy - b.cy;
                    if (Math.abs(dx) < minDx && Math.abs(dy) < minDy) {
                        a.cx += a.nx * 7; a.cy += a.ny * 7;
                        b.cx += b.nx * 7; b.cy += b.ny * 7;
                    }
                }
            }
        }

        pills.forEach(p => {
            p.cx = Math.max(p.bw / 2 + 4, Math.min(canvasCssW - p.bw / 2 - 4, p.cx));
            p.cy = Math.max(p.bh / 2 + 4, Math.min(canvasCssH - p.bh / 2 - 4, p.cy));
            const bx = p.cx - p.bw / 2, by = p.cy - p.bh / 2;
            c.fillStyle = "rgba(15, 23, 42, 0.9)";
            roundRectPath(c, bx, by, p.bw, p.bh, 6);
            c.fill();
            c.strokeStyle = "rgba(71, 85, 105, 0.7)";
            c.lineWidth = 1;
            c.stroke();
            c.fillStyle = "#F8FAFC";
            c.textAlign = "center";
            c.textBaseline = "middle";
            c.fillText(p.text, p.cx, p.cy);
        });
    }

    function updateUI() {
        document.getElementById("score-display").innerText = score;
        const comboEl = document.getElementById("combo-display");
        if (combo > 1) {
            comboEl.innerText = `x${combo} Combo!`;
            comboEl.classList.add("show");
        } else {
            comboEl.classList.remove("show");
        }
        const penaltyEl = document.getElementById("penalty-display");
        if (wrongCombo > 0) {
            const pVal = 100 * Math.pow(2, wrongCombo - 1);
            penaltyEl.innerText = `連錯懲罰: -${pVal}`;
            penaltyEl.classList.add("show");
        } else {
            penaltyEl.classList.remove("show");
        }
    }

    function handlePenalty() {
        try { SoundManager.play('wrong', lastPointerClientX); } catch (e) {}
        wrongCombo++;
        combo = 0;
        currentLevel = 1;
        const penalty = 100 * Math.pow(2, wrongCombo - 1);
        score = Math.max(0, score - penalty);
        updateUI();
        const geometryPane = document.getElementById("geometry-pane");
        geometryPane.classList.add("main-error");
        scheduleTimeout(() => geometryPane.classList.remove("main-error"), 400);
        if (gameState === "DRAWING_PHASE") {
            scheduleTimeout(() => {
                if (gameState === "DRAWING_PHASE") nextMission();
            }, 500);
        }
    }

    function nextMission() {
        if (gameState === "GAMEOVER" || gameState === "MENU") return;
        try {
            if (combo >= 6 && currentLevel < 3) {
                currentLevel = 3;
                try { SoundManager.play('levelUp'); } catch (e) {}
                const banner = document.getElementById("level-up-banner");
                banner.innerText = "🌀 終極挑戰：全向空間建構！";
                banner.classList.add("show");
                scheduleTimeout(() => banner.classList.remove("show"), 1500);
            } else if (combo >= 3 && combo < 6 && currentLevel < 2) {
                currentLevel = 2;
                try { SoundManager.play('levelUp'); } catch (e) {}
                const banner = document.getElementById("level-up-banner");
                banner.innerText = "🚀 難度升級：畫出高線！";
                banner.classList.add("show");
                scheduleTimeout(() => banner.classList.remove("show"), 1500);
            }

            currentMission = generateMission(currentLevel);
            numFilled = false; denFilled = false; flashEdge = null; isDragging = false;

            const ratioHtml = `<span class="math-fn">${currentMission.funcName}</span> <i>${currentMission.refName}</i>`;
            document.getElementById("question-text").innerHTML = `在 <span class="math-tri">△<i>${currentMission.triName}</i></span> 中，求 <span class="math-ratio">${ratioHtml}</span>`;
            document.getElementById("ratio-label").innerHTML = ratioHtml;

            resetSlot("numerator-slot", "分子");
            resetSlot("denominator-slot", "分母");

            if (currentLevel >= 2) {
                gameState = "DRAWING_PHASE";
                document.getElementById("formula-zone").classList.add("locked");
            } else {
                gameState = "SELECTION_PHASE";
                document.getElementById("formula-zone").classList.remove("locked");
            }
            updateInstruction();
            adaptCanvas();
            drawGeometry();
        } catch (error) {
            console.error("nextMission() fatal:", error);
        }
    }

    function handleEdgeSelection(edgeType) {
        if (gameState !== "SELECTION_PHASE") return;
        let matched = false, targetSlotId = null, earlyDenominator = false;
        if (!numFilled) {
            if (edgeType === currentMission.steps.num) {
                targetSlotId = "numerator-slot"; numFilled = true; matched = true;
            } else if (edgeType === currentMission.steps.den) {
                earlyDenominator = true;
            }
        } else if (!denFilled) {
            if (edgeType === currentMission.steps.den) {
                targetSlotId = "denominator-slot"; denFilled = true; matched = true;
            }
        }
        if (matched) {
            try { SoundManager.play('correct', lastPointerClientX); } catch (e) {}
            combo++; wrongCombo = 0; score += 100 * combo;
            fillSlot(targetSlotId, currentMission.data[edgeType]);
            flashEdge = { id: edgeType, color: "#10B981", timer: Date.now() + 300 };
            drawGeometry();
            createExplosion(canvasCssW / 2, canvasCssH / 2);
            showFloatingText(combo > 3 ? "GODLIKE!" : "NICE!", "#10B981");
            if (numFilled && denFilled) {
                try { SoundManager.play('success', lastPointerClientX); } catch (e) {}
                gameState = "SUCCESS";
                document.getElementById("instruction").innerText = "✨ 建構完成！ ✨";
                document.getElementById("geometry-pane").classList.add("main-success");
                updateUI();
                scheduleTimeout(() => {
                    document.getElementById("geometry-pane").classList.remove("main-success");
                    if (gameState === "SUCCESS") nextMission();
                }, 700);
            } else {
                updateInstruction();
            }
            updateUI();
        } else {
            flashEdge = { id: edgeType, color: "#EF4444", timer: Date.now() + 400 };
            drawGeometry();
            if (earlyDenominator) showFloatingText("請先尋找分子", "#EF4444");
            handlePenalty();
        }
    }

    function endGame() {
        if (gameState === "GAMEOVER") return;
        roundId++;
        clearAllTimers();
        gameState = "GAMEOVER";
        try { SoundManager.stopBGM(); SoundManager.play('gameover'); } catch (e) {}
        if (window.MobileGameShell && typeof window.MobileGameShell.setGameActive === 'function') {
            window.MobileGameShell.setGameActive(false);
        }

        const stu = window.MobileGameShell ? window.MobileGameShell.getStudent() : null;
        if (stu && stu.name) currentPlayer = stu.name;

        let rep = null;
        try {
            if (window.MobileGameShell) {
                rep = window.MobileGameShell.reportRound({
                    gameId: GAME_ID,
                    score: score,
                    win: score > 0,
                    durationMs: 30000
                });
            }
        } catch (e) {}

        let board = (rep && Array.isArray(rep.top10)) ? rep.top10 : null;
        if (!board) {
            try {
                const gb = window.MathCoreBonus && window.MathCoreBonus.GameBridge;
                if (gb && typeof gb.getTop10 === 'function') board = gb.getTop10(GAME_ID);
            } catch (e) {}
        }
        board = board || [];

        const tableHtml = (window.MobileGameShell && typeof window.MobileGameShell.renderTop10Html === 'function')
            ? window.MobileGameShell.renderTop10Html(board, stu)
            : '';

        const top10Badge = (rep && rep.inTop10)
            ? '<div class="top10-badge">🏅 進入前十名排行榜！</div>'
            : '';

        document.querySelectorAll('.end-overlay').forEach(el => el.remove());
        const endScreen = document.createElement('div');
        endScreen.className = "overlay end-overlay";
        endScreen.innerHTML = `
            <div class="overlay-card">
                <h1 style="color: #FACC15; text-shadow: 0 0 28px rgba(250, 204, 21, 0.55);">TIME UP!</h1>
                <div style="font-size: clamp(1.3rem, 5vw, 1.8rem); font-weight: 800;">最終得分：${Number(score)}</div>
                ${top10Badge}
                <div class="leaderboard-box">
                    <h2>🏆 榮譽殿堂 🏆</h2>
                    ${tableHtml}
                </div>
                <div class="btn-row">
                    <button class="mega-btn" id="btn-replay">🔄 再玩一次</button>
                    <button class="mega-btn btn-secondary" id="btn-lobby">🏠 返回遊戲大廳</button>
                </div>
            </div>`;
        document.body.appendChild(endScreen);

        document.getElementById('btn-replay').addEventListener('click', () => {
            endScreen.remove();
            startGame(gameMode);
        });
        document.getElementById('btn-lobby').addEventListener('click', () => {
            if (window.MobileGameShell && typeof window.MobileGameShell.goToLobby === 'function') {
                window.MobileGameShell.goToLobby();
            }
        });

        createExplosion(canvasCssW / 2, canvasCssH / 4);
    }

    function resetSlot(id, text) {
        const el = document.getElementById(id);
        el.className = "slot";
        el.innerText = text;
        el.classList.remove("active");
    }
    function activateSlot(id) { document.getElementById(id).classList.add("active"); }
    function fillSlot(id, text) {
        const el = document.getElementById(id);
        el.className = "slot filled";
        el.innerText = text;
        el.classList.remove("active");
    }
    function updateInstruction() {
        const inst = document.getElementById("instruction");
        if (gameState === "DRAWING_PHASE") {
            inst.innerText = "🔥 難度升級：請從發光頂點滑向對邊，畫出高線";
            inst.style.color = "#EF4444";
        } else {
            if (!numFilled) {
                inst.innerText = `🎯 第一步：點擊圖形中的 [${stepNames[currentMission.steps.num]}] 作為分子`;
                activateSlot("numerator-slot");
                document.getElementById("denominator-slot").classList.remove("active");
            } else if (!denFilled) {
                inst.innerText = `🎯 第二步：點擊圖形中的 [${stepNames[currentMission.steps.den]}] 作為分母`;
                document.getElementById("numerator-slot").classList.remove("active");
                activateSlot("denominator-slot");
            }
            inst.style.color = "#FACC15";
        }
    }
    function showFloatingText(text, color) {
        const el = document.createElement('div');
        el.className = 'ritual-text';
        el.innerText = text;
        el.style.color = color;
        el.style.left = '50%';
        el.style.top = '45%';
        el.style.animation = 'flyUp 0.9s ease-out forwards';
        document.getElementById('viz-layer').appendChild(el);
        scheduleTimeout(() => el.remove(), 950);
    }
    function varToRgb(varName) {
        const hex = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
        if (hex.startsWith('#')) {
            return `${parseInt(hex.slice(1, 3), 16)}, ${parseInt(hex.slice(3, 5), 16)}, ${parseInt(hex.slice(5, 7), 16)}`;
        }
        return "255,255,255";
    }
</script>
